[package]
name = "topcoat-evals"
version = "0.1.0"
authors = ["Matthias Debernardini <matthias@nashvilleautomation.io>"]
edition = "2024"
description = "Evals for topcoat-si: code mode against the tool loop"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
topcoat-si = { path = "..", features = ["code-mode"] }
