[package]
name = "claudius"
version = "0.33.0"
authors = ["Robert Escriva <robert@rescrv.net>"]
edition = "2024"
description = "SDK for the Anthropic API"
license = "Apache-2.0"
repository = "https://github.com/rescrv/claudius"

[features]
default = ["native-tls"]

rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
tracing = "0.1"
base64 = "0.22.1"
bytes = "1.11.1"
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
time = { version = "0.3.47", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-test = "0.4.5"

[[example]]
name = "retry_example"
path = "examples/retry_example.rs"

[[example]]
name = "usage_monitoring"
path = "examples/usage_monitoring.rs"

[[example]]
name = "server_tools"
path = "examples/server_tools.rs"

[[example]]
name = "files"
path = "examples/files.rs"
