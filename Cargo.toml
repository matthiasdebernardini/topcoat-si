[package]
name = "carpa"
version = "0.1.0"
authors = ["Matthias Debernardini <matthias@nashvilleautomation.io>"]
edition = "2024"
description = "Superintelligence for Topcoat apps: Claude, Jev and Firecrawl"
license = "Apache-2.0"
repository = "https://github.com/matthiasdebernardini/carpa"

[workspace]
members = [".", "evals"]

[features]
code-mode = ["dep:monty-pool", "dep:monty-types"]
surreal = ["dep:surrealdb"]
turbopuffer = ["dep:turbopuffer"]

[dependencies]
tracing = "0.1"
base64 = "0.22.1"
bytes = "1.11.1"
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
schemars = { version = "1.2.3", features = ["preserve_order"] }
time = { version = "0.3.47", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["sync", "time"] }
url = "2.5.8"
monty-pool = { version = "1.2", optional = true }
monty-types = { version = "1.2", optional = true }
surrealdb = { version = "3.2", default-features = false, features = ["kv-surrealkv"], optional = true }
turbopuffer = { version = "0.1.0-beta.1", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-test = "0.4.5"

[[example]]
name = "turbopuffer_search"
path = "examples/turbopuffer_search.rs"
required-features = ["turbopuffer"]
