[package]
name = "topcoat-si-review-harness"
publish = false
version = "0.0.0"
edition = "2024"
[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
tracing-opentelemetry = "0.33"
sentry-tracing = "=0.49.3"
topcoat-si = { path = "..", default-features = false, features = ["rustls-tls"] }
sentry = { version = "=0.49.3", default-features = false, features = ["test"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["trace", "testing"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-json", "reqwest-blocking-client"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# Direct dependencies used by the independent regression tests.
base64 = "0.22.1"
bytes = "1.11.1"
futures = "0.3.32"
