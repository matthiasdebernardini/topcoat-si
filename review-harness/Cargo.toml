[package]
name = "claudius-review-harness"
publish = false
version = "0.0.0"
edition = "2024"
[dependencies]
claudius = { path = "../../vendor/claudius", default-features = false, features = ["rustls-tls"] }
sentry = { version = "=0.49.3", default-features = false, features = ["test"] }
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "testing"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["trace", "http-json", "reqwest-blocking-client"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Direct dependencies used by the independent regression tests.
async-trait = "0.1.89"
base64 = "0.22.1"
biometrics = "0.14.0"
bytes = "1.11.1"
futures = "0.3.32"
