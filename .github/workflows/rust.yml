name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: clippy with turbopuffer
        run: cargo clippy --all-targets --features turbopuffer --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: lib and integration tests
        run: cargo nextest run --lib --tests --locked --features turbopuffer
      - name: doc tests
        run: cargo test --doc --locked --features turbopuffer

  code-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: install the monty worker
        run: cargo install monty-runtime --version 1.2.0 --locked
      - name: clippy with code-mode and surreal
        run: cargo clippy --workspace --all-targets --features code-mode,surreal,turbopuffer --locked -- -D warnings
      - name: code-mode and surreal tests
        run: |
          MONTY_BIN="$HOME/.cargo/bin/monty" cargo nextest run --workspace --lib --locked --features code-mode,surreal,turbopuffer code_mode surreal db
          cargo nextest run -p topcoat-evals --locked
      - name: code-mode and surreal doc test
        run: cargo test --doc --locked --features code-mode,surreal,turbopuffer
