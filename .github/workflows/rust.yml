name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: lib and integration tests
        run: cargo nextest run --lib --tests --locked
      - name: doc tests
        run: cargo test --doc --locked

  code-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: install the monty worker
        run: cargo install monty-runtime --version 1.2.0 --locked
      - name: clippy with code-mode
        run: cargo clippy --all-targets --features code-mode --locked -- -D warnings
      - name: code-mode tests
        run: MONTY_BIN="$HOME/.cargo/bin/monty" cargo nextest run --lib --locked --features code-mode code_mode
      - name: code-mode doc test
        run: cargo test --doc --locked --features code-mode
